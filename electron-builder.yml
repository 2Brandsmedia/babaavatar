appId: com.2brandsmedia.babaavatar
productName: BabaAvatar
copyright: Copyright © 2026 2Brands Media GmbH

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - resources/**/*
  - package.json

asar: true

# Kein Native-Rebuild: @serialport/bindings-cpp (via osc) liefert N-API-Prebuilds für
# alle Plattformen mit; der Rebuild scheitert an node-gyp/Python-3.12 (distutils weg).
npmRebuild: false

asarUnpack:
  - node_modules/electron-updater/**/*

# Beide Plattformen seit 2026-08-02 Abend (Entscheidung Baba): MediaPipe-Stack läuft
# überall identisch; nur der optionale NVIDIA-Maxine-Pfad ist Windows-exklusiv.
# ⚠️ Ohne Code-Signing kann der Auto-Updater auf macOS NICHT aktualisieren —
# Mac-Updates werden manuell per .dmg installiert.
mac:
  category: public.app-category.video
  # Nur das App-Bundle bauen — die DMGs entstehen per hdiutil (electron-builders
  # dmg-Schritt braucht ein Python, das auf dem Build-Mac fehlt).
  target:
    - target: dir
      arch:
        - arm64
        - x64
  icon: resources/icon.png
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSCameraUsageDescription: 'BabaAvatar braucht Zugriff auf die Kamera für das Gesichts-Tracking.'
    NSMicrophoneUsageDescription: 'BabaAvatar braucht Zugriff auf das Mikrofon für Lipsync.'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
  artifactName: 'BabaAvatar-Setup-${version}.${ext}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: false
  shortcutName: BabaAvatar
  uninstallDisplayName: 'BabaAvatar - VTuber Tracking'
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  differentialPackage: true
  installerIcon: resources/installer.ico
  uninstallerIcon: resources/installer.ico
  installerHeader: resources/installer-header.bmp
  installerSidebar: resources/installer-sidebar.bmp
  uninstallerSidebar: resources/installer-sidebar.bmp
  installerHeaderIcon: resources/installer.ico
  include: resources/installer.nsh
  installerLanguages:
    - de_DE
    - en_US
  displayLanguageSelector: false

publish:
  provider: github
  owner: 2Brandsmedia
  repo: babaavatar
  releaseType: release
