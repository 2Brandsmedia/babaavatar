appId: com.2brandsmedia.babaavatar
productName: BabaAvatar
copyright: Copyright © 2026 2Brands Media GmbH

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - resources/**/*
  - package.json

asar: true

asarUnpack:
  - node_modules/electron-updater/**/*

# Windows-only seit 2026-08-02 (Entscheidung Baba): Mac ist reine Dev-Umgebung (npm run dev),
# es gibt keinen Mac-Release-Build mehr. Native NVIDIA-Pfade (Maxine) sind Windows-exklusiv.
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
  artifactName: 'BabaAvatar-Setup-${version}.${ext}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: false
  shortcutName: BabaAvatar
  uninstallDisplayName: 'BabaAvatar - VTuber Tracking'
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  differentialPackage: true
  installerIcon: resources/installer.ico
  uninstallerIcon: resources/installer.ico
  installerHeader: resources/installer-header.bmp
  installerSidebar: resources/installer-sidebar.bmp
  uninstallerSidebar: resources/installer-sidebar.bmp
  installerHeaderIcon: resources/installer.ico
  include: resources/installer.nsh
  installerLanguages:
    - de_DE
    - en_US
  displayLanguageSelector: false

publish:
  provider: github
  owner: 2Brandsmedia
  repo: babaavatar
  releaseType: release
